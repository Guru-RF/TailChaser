# tailchaser-simplex configuration — taken over from tests/fixtures/hotspot-node/svxlink.conf, tests/fixtures/hotspot-node/hotspot, tests/fixtures/hotspot-node/hotspot_volume
# All settings and their meaning: /etc/tailchaser/simplex.conf.example

[reflector]
domain          = reflector.example.org
callsign        = ON0TST-S
email           = sysop@example.org
default_tg      = 1745
monitor_tgs     = 1745++
tg_select_timeout_s = 30
udp_heartbeat_s = 5
location        = "Testville, hill #2"
sysop           = "ON0TST"
qth_name        = "Test QTH"
latitude        = 50.8467
longitude       = 4.3525
locator         = JO20eu

[radio]
serial_port     = /dev/ttyAMA0
freq            = 145.450
bandwidth       = wide
ctcss_rx        = none
ctcss_tx        = none
squelch         = 1
volume          = 1
filter_emphasis = 0
filter_highpass = 0
filter_lowpass  = 0
cos_line        = 12
cos_active_low  = true
ptt_line        = 16
ptt_active_low  = true

[tx]
delay_ms        = 900
hang_ms         = 0
timeout_s       = 360
gain_db         = 0

[ident]
callsign        = ON0TST
interval_min    = 60
wpm             = 24
pitch_hz        = 600
level_db        = -12

[gate]
mode            = monitor    # everything is relayed, as SvxLink did. The log and the status
                             # page mark what "on" would keep off the talkgroup: noise bursts,
                             # dead carriers, kerchunks. Watch that for a few days, then set on.

[dtmf]
tg_prefix       = 91

[audio]
alsa_device     = plughw:0
audio_channel   = left
playback_pct    = 77
capture_pct     = 50
preamp_db       = 0

[status]
http_port       = 8080
