###############################################################################
#  Test fixture: the SvxLink configuration of a hotspot-image simplex node.   #
#  Callsigns, addresses and keys are made up.                                 #
###############################################################################

[GLOBAL]
LOGIC_CORE_PATH=/usr/lib/aarch64-linux-gnu/svxlink/
LOGICS=SimplexLogic,ReflectorLogic
CFG_DIR=svxlink.d
TIMESTAMP_FORMAT="%c"
CARD_SAMPLE_RATE=48000
LINKS=NetLink

[SimplexLogic]
TYPE=Simplex
RX=Rx1
TX=Tx1
MODULES=ModuleParrot
CALLSIGN=ON0TST
CW_WPM=24
CW_PITCH=600
CW_AMP=-12
SHORT_IDENT_INTERVAL=0
LONG_IDENT_INTERVAL=60
LONG_CW_ID_ENABLE=1
LONG_VOICE_ID_ENABLE=0
LONG_ANNOUNCE_ENABLE=1
EVENT_HANDLER=/usr/share/svxlink/events.tcl
DEFAULT_LANG=en_US
RGR_SOUND_DELAY=-1
MACROS=Macros

# the stock file's repeater logic: present, but not listed in LOGICS
[RepeaterLogic]
TYPE=Repeater
RX=Rx1
TX=Tx1
CALLSIGN=MYCALL
LONG_IDENT_INTERVAL=30

[NetLink]
NAME=REFLINK
CONNECT_LOGICS=ReflectorLogic:9:,SimplexLogic:9:
DEFAULT_ACTIVE=1

[Macros]

[ReflectorLogic]
TYPE=Reflector
ID=9
DNS_DOMAIN=reflector.example.org
CALLSIGN="ON0TST-S"
CERT_EMAIL=sysop@example.org
DEFAULT_TG=1745
MONITOR_TGS=1745++
ANNOUNCE_REMOTE_MIN_INTERVAL=3600
EVENT_HANDLER=/usr/share/svxlink/events.tcl
NODE_INFO_FILE=node_info.json
MUTE_FIRST_TX_LOC=0
MUTE_FIRST_TX_REM=0
UDP_HEARTBEAT_INTERVAL=5
QSY_PENDING_TIMEOUT=15
VERBOSE=1

[Rx1]
TYPE=Local
AUDIO_DEV=alsa:plughw:0
AUDIO_CHANNEL=0
AUDIO_DEV_KEEP_OPEN=1
SQL_TYPE=GPIOD
SQL_GPIOD_CHIP=gpiochip0
SQL_GPIOD_LINE=!12
SQL_DET=GPIOD
SQL_DELAY=500
SQL_HANGTIME=300
DEEMPHASIS=0
PREAMP=0
PEAK_METER=0
DTMF_DEC_TYPE=INTERNAL

[Tx1]
TYPE=Local
AUDIO_DEV=alsa:plughw:0
AUDIO_CHANNEL=0
AUDIO_DEV_KEEP_OPEN=1
PTT_TYPE=GPIOD
PTT_GPIOD_CHIP=gpiochip0
PTT_GPIOD_LINE=!16
PTT_HANGTIME=0
TIMEOUT=6000
TX_DELAY=900
PREEMPHASIS=0
